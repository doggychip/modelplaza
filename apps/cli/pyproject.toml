[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelplaza"
version = "0.1.0"
description = "CLI tool for Model Plaza - upload, download, and manage AI models"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
    "tqdm>=4.66",
]

[project.scripts]
mp = "modelplaza.cli:cli"
modelplaza = "modelplaza.cli:cli"

[tool.setuptools.packages.find]
include = ["modelplaza*"]
