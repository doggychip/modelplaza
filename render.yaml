databases:
  - name: modelplaza-db
    plan: free
    databaseName: modelplaza
    user: modelplaza

services:
  - type: web
    name: modelplaza-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: modelplaza-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: local
      - key: CORS_ORIGINS
        value: https://modelplaza.vercel.app,http://localhost:3001
